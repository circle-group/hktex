name: "uv-texture-fitting"
tag: "${filename:${data.mesh_path}}"
exp_root_dir: "outputs"
seed: 0

data_type: data.uv-texture-sampler
data:
  mesh_path: ../objects/spot/spot_triangulated.obj
  bake_vert_colours_if_textured: False
  merge_tex: True
  
  batch_size: 64
  num_workers: 0
  sampling_method: "uniform"

trainer_type: trainers.uv-texture
trainer:
  tracer_type: modules.cpu-geodesic-tracer
  tracer: 
    n_debug_traces: 10

  eigen_albo: 
    k_eig: 256
    mesh_path: ${data.mesh_path}
    distance_weighting: gaussian_0.05
    local_frames: principal_curvatures
    precompute_anisotropies: [1, 5, 15, 30, 60, 100, 200]
    precompute_angles_every_deg: 30

  model: 
    n_sources: 500
    kernel_dim: 32
    diff_time: 0.1

  optimizers:
    - name: Adam
      args:
        lr: 1e-3  #5e-4
      params:
        model._kernel_colours: {}
        model._angles: {}
        model._anisotropies: {}
        model._thresholds: {}
        model._sharpnesses: {}
        model._opacities: {}
        model.out_net: {}
    - name: GeodesicOpt
      args:
        lr: 1e-1
      tracer: tracer
      params:
        model._kernel_locations:
          face_ids: model._kernel_face_ids

  density_controllers:  # aka Adaptive Density Controllers (ADCs)
    - density_controller_type: density_controllers.opacity
      args:
        start_iter: 1_000
        prune_opacity: 0.05
        prune_interval: 500
        reset_opacity_interval: 1000
        stop_iter: 3000
    - density_controller_type: density_controllers.error_based_densification
      args:
        start_iter: 450
        densify_interval: 200
        error_accumulation_interval: 50
        error_threshold: 0.1
        size_threshold: 0.2
        max_densify_ratio: 0.2
        max_kernels: ${mul:${trainer.model.n_sources}, 6}
        stop_iter: 4000



optim:
  iters: 5000
