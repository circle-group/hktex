name: "uv-texture-fitting"
tag: "${filename:${data.mesh_path}}"
exp_root_dir: "outputs"
seed: 0

data_type: data.uv-texture-sampler
data:
  mesh_path: ../objects/spot/spot_triangulated.obj
  bake_vert_colours_if_textured: False
  merge_tex: True
  
  batch_size: 512
  num_workers: 0
  sampling_method: "uniform"

trainer_type: trainers.uv-texture
trainer:
  tracer_type: modules.cpu-geodesic-tracer
  tracer: 
    n_debug_traces: 10

  eigen_albo: 
    k_eig: 256
    mesh_path: ${data.mesh_path}
    distance_weighting: gaussian_0.05
    mass_type: ${trainer.model.mass_type}
    local_frames: principal_curvatures
    precompute_anisotropies: [1, 5, 15, 30, 60, 100, 200]
    precompute_angles_every_deg: 30

  model: 
    n_sources: 2000
    kernel_dim: 32
    diff_time: 0.000019026
    mass_type: one
    init_min_threshold: 0.5  # The higher the smaller
    range_enforcement_type: pgd
    init_kernel_edge_type: uniform
    out_net: False
    normalize_colours: False

  optimizers:
    - name: Adam
      args: {}
      #   lr: 1e-3  #5e-4
      params:
        model._kernel_colours: {lr: 0.008395702306371162}
        model._angles: {lr: 3.2652328263415363e-05}
        model._anisotropies: {lr: 4.30738638898606e-05}
        model._thresholds: {lr: 0.00011733030036139524}
        model._sharpnesses: {lr: 0.0014970924840240095}
        model._opacities: {lr: 0.0028242210378744965}
        # model.out_net: {}
    - name: GeodesicOpt
      args:
        lr: 0.09901128163500622
      scheduler:
        name: CosineAnnealingLR
        args:
          T_max: ${optim.iters}
          eta_min: 1e-7
      tracer: tracer
      params:
        model._kernel_locations:
          face_ids: model._kernel_face_ids

  density_controllers:  # aka Adaptive Density Controllers (ADCs)
    - density_controller_type: density_controllers.opacity
      args:
        start_iter: ${int:${mul:${optim.iters}, 0.2}}
        prune_opacity: 0.064533
        prune_interval: ${int:${mul:${optim.iters}, 0.1}}
        reset_opacity_interval: ${int:${mul:${optim.iters}, 0.1}}
        stop_iter: ${int:${mul:${optim.iters}, 0.5}}
    - density_controller_type: density_controllers.error_based_densification
      args:
        start_iter: ${int:${mul:${optim.iters}, 0.05}}
        densify_interval: ${int:${mul:${optim.iters}, 0.1}}
        error_accumulation_interval: ${int:${mul:${mul:${optim.iters}, 0.1}, 0.25}}
        error_threshold: 0.020578
        size_threshold: 0.12208
        max_densify_ratio: 0.4
        max_kernels: ${int:${mul:${trainer.model.n_sources}, 5}}
        stop_iter: ${int:${mul:${optim.iters}, 0.8}}



optim:
  iters: 5000
