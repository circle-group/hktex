name: "uv-texture-fitting-pcl"
tag: "${filename:${data.mesh_path}}"
exp_root_dir: "outputs"
seed: 0

data_type: data.uv-texture-sampler
data:
  mesh_path: ../objects/spot/spot_triangulated.obj
  bake_vert_colours_if_textured: False
  merge_tex: True

  batch_size: 4096
  num_workers: 0
  sampling_method: "uniform"

  use_importance_sampling: True
  importance_sampling_pool_size: 1000000
  importance_sampling_warmup_steps: 250
  importance_sampling_ema_beta: 0.99

trainer_type: trainers.uv-texture-pcl
trainer:
  use_knn_implementation: True
  model_type: modules.pcl-texture

  tracer_type: modules.gpu-geodesic-tracer
  tracer:
    n_debug_traces: 10
    debug: False

  eigen_albo_type: ""
  eigen_albo: {}

  model:
    n_sources: 10000
    out_dim: 3
    out_net: False
    normalize_colours: False
    allow_negative_colours: True
    range_enforcement_type: pgd
    residual_gain_init: 1.0
    residual_gain_min: 0.0
    residual_recenter_every: 100
    residual_recenter_stop_iter: ${int:${mul:${optim.iters}, 0.8}}

    knn_k: 12
    weighting: softmax_rbf
    softmax_temperature: 0.02
    distance_eps: 1.0e-08

    use_face_normal_weighting: False
    normal_weight_beta: 8.0

    softmax_temperature_min: 1e-3

    faiss:
      use_float16: False
      distance_impl: bmm
      build_db_norm: True
      compile_distances: True

  loss_type: "mse_loss"
  data_initialisation_random_ratio: 1.0

  tv_loss_weight: 7.5e-5
  smoothness_loss_weight: 2e-5

  edge_aware_photo_enabled: False
  edge_aware_photo_k: 8
  edge_aware_photo_strength: 1.0
  edge_aware_photo_max_weight: 4.0
  edge_aware_photo_eps: 1e-8

  edge_aware_reg_enabled: False
  edge_aware_reg_sigma_colour: 0.1
  edge_aware_reg_min_weight: 0.05
  edge_aware_reg_eps: 1e-8
  edge_aware_reg_detach_colours: True

  optimizers:
    - name: Adam
      args: {}
      params:
        model._mean_colour: {lr: 0.001}
        model._kernel_colours: {lr: 0.04}
        model._softmax_temperature_raw: {lr: 1e-4}
        model._residual_gain_raw: {lr: 5e-4}
      scheduler:
        name: CosineAnnealingLR
        args:
          T_max: 10000
          eta_min: 1.0e-06

    - name: GeodesicOpt
      args:
        lr: 0.001
        momentum: 0.9
      scheduler:
        name: StepLR
        args:
          gamma: 0.7
          step_size: 1200
      tracer: tracer
      params:
        model._kernel_locations:
          face_ids: model._kernel_face_ids

  density_controllers: []

optim:
  iters: 10000
